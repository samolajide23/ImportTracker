<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7faf9">
  <title>Compare payment views · Import Tracker</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7f6;--panel:#fff;--text:#17302d;--muted:#71857f;--line:#dce8e4;--accent:#173d37;--soft:#e9f2ef;--green:#408a7c;--amber:#8c650f;--amber-soft:#fff0d3;--shadow:0 8px 28px #1c55440b}
    [data-theme="dark"]{color-scheme:dark;--bg:#101a18;--panel:#1b2926;--text:#e5f0ec;--muted:#a2b5ae;--line:#354843;--accent:#9ad5c4;--soft:#253c36;--green:#9ad5c4;--amber:#f0c36d;--amber-soft:#45371d;--shadow:0 8px 28px #0003}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
    button,a{font:inherit}
    button,.button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer}
    .shell{max-width:1180px;margin:auto;padding:28px}
    header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px}
    .brand,.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
    h1{font-size:clamp(29px,5vw,44px);letter-spacing:-.05em;margin:4px 0}
    h2{font-size:19px;margin:0}
    p{margin:5px 0;color:var(--muted)}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .option{min-width:0}
    .option-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px}
    .option-head strong{font-size:14px}
    .option-head span{font-size:11px;color:var(--muted)}
    .view{min-width:0;overflow:hidden;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
    .section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px}
    .section-title p{font-size:11px}
    .badge{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:800;white-space:nowrap}
    .money{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
    .money small{display:block;color:var(--muted);font-size:10px;font-weight:400}
    .event-title{font-weight:700}
    .muted{color:var(--muted);font-size:11px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
    .row:last-child{border-bottom:0}
    .row-main{min-width:0}
    .row-main .muted{margin-top:3px}
    .row a,.timeline-item a,.group-item a,.calendar-item a{color:inherit;text-decoration:none}
    .row a:hover,.timeline-item a:hover,.group-item a:hover,.calendar-item a:hover{text-decoration:underline}
    .focus-amount{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0;padding:14px;border-radius:12px;background:var(--amber-soft)}
    .focus-amount .money{font-size:22px}
    .focus-list{margin-top:9px}
    .focus-tasks{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
    .focus-tasks h3{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:0 0 5px}
    .focus-task{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
    .focus-task:last-child{border-bottom:0}
    .task-check{width:14px;height:14px;margin-top:2px;border:1.5px solid var(--green);border-radius:4px}
    .focus-task a{color:inherit;text-decoration:none}
    .focus-task a:hover{text-decoration:underline}
    .focus-task .muted{margin-top:2px}
    .focus-tasks .task-link{font-size:10px;color:var(--green);white-space:nowrap}
    .timeline{position:relative;padding-left:22px}
    .timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
    .timeline-item{position:relative;display:grid;grid-template-columns:95px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0}
    .timeline-item:before{content:"";position:absolute;left:-19px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--green)}
    .date{font-size:11px;font-weight:750;color:var(--green)}
    .event-amount{text-align:right}
    .group{margin-top:15px}
    .group h3{margin:0 0 5px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .group-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
    .group-item:last-child{border-bottom:0}
    .calendar-list{display:grid;gap:10px}
    .calendar-block{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
    .calendar-date{align-self:start;padding:7px;border-radius:9px;background:var(--soft);text-align:center;color:var(--green);font-size:11px;font-weight:800}
    .calendar-date small{display:block;font-size:9px;color:var(--muted);font-weight:600}
    .calendar-item{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
    .ledger{width:100%;border-collapse:collapse;font-size:12px}
    .ledger th{padding:9px 7px;text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
    .ledger td{padding:10px 7px;border-top:1px solid var(--line);vertical-align:middle}
    .ledger tr:hover td{background:var(--soft)}
    .ledger .money{text-align:right}
    .ledger .money small{text-align:right}
    .status{color:var(--amber);font-size:10px;font-weight:750}
    .status.estimate,.status.step{color:var(--muted)}
    .unknown{margin-top:12px;padding:10px;border-radius:9px;background:var(--soft);color:var(--muted);font-size:11px}
    .empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
    @media(max-width:760px){.shell{padding:18px}.options{grid-template-columns:1fr}}
    @media(max-width:500px){.shell{padding:14px}.controls{width:100%}.controls>*{flex:1;text-align:center}.timeline-item{grid-template-columns:1fr auto;gap:3px 8px}.timeline-item>.date,.timeline-item>.timeline-main{grid-column:1}.timeline-item>.event-amount{grid-column:2;grid-row:1/3}.calendar-block{grid-template-columns:64px 1fr}.ledger th:nth-child(3),.ledger td:nth-child(3){display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="brand">IMPORT / FOCUS · PAYMENT PREVIEW</div><h1>Five ways to read the next payments</h1><p>Each view uses the same saved dates and estimates. “Date to confirm” means no payment date is set yet.</p></div>
      <div class="controls"><a class="button" href="index.html">← Back to cars</a><button id="themeToggle" type="button">Dark mode</button></div>
    </header>
    <section id="options" class="options" aria-label="Five payment timeline styles"></section>
  </main>
  <script src="tracker.js"></script>
  <script src="payment-options.js"></script>
</body>
</html>
