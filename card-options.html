<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7faf9">
  <title>Compare car card styles · Import Tracker</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7f6;--panel:#fff;--text:#17302d;--muted:#71857f;--line:#dce8e4;--accent:#173d37;--accent-soft:#e9f2ef;--green:#408a7c;--amber:#8c650f;--amber-soft:#fff0d3;--shadow:0 8px 28px #1c55440b}
    [data-theme="dark"]{color-scheme:dark;--bg:#101a18;--panel:#1b2926;--text:#e5f0ec;--muted:#a2b5ae;--line:#354843;--accent:#9ad5c4;--accent-soft:#253c36;--green:#9ad5c4;--amber:#f0c36d;--amber-soft:#45371d;--shadow:0 8px 28px #0003}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
    button,a{font:inherit}
    button,.button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer}
    .shell{max-width:1180px;margin:auto;padding:28px}
    header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:28px}
    .brand,.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
    h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.05em;margin:4px 0}
    h2{font-size:20px;margin:0}
    .intro p{margin:5px 0;color:var(--muted)}
    .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .option{min-width:0}
    .option-label{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
    .option-label strong{font-size:14px}
    .option-label span{font-size:11px;color:var(--muted)}
    .card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:var(--shadow)}
    .car-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .car-heading h2{font-size:19px}
    .plate{margin-top:4px;color:var(--muted);font-size:12px}
    .status{flex:none;padding:5px 9px;border-radius:99px;background:var(--accent-soft);color:var(--green);font-size:10px;font-weight:800}
    .status.due{background:var(--amber-soft);color:var(--amber)}
    .small{display:block;color:var(--muted);font-size:10px;font-weight:400;line-height:1.3}
    .pair{display:inline-block;font-variant-numeric:tabular-nums}
    .pair .small{margin-top:1px}
    .range{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .label{display:block;margin-bottom:3px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}
    .progress{height:7px;overflow:hidden;border-radius:99px;background:var(--accent-soft)}
    .progress span{display:block;height:100%;border-radius:inherit;background:var(--green)}
    .open{display:inline-block;margin-top:14px;padding:9px 13px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:12px;font-weight:750}
    [data-theme="dark"] .open{color:#10201c}
    .photo{display:block;width:100%;height:175px;object-fit:cover;background:#dce5e1}
    .photo-placeholder{display:grid;place-items:center;height:145px;background:linear-gradient(135deg,#dce9e4,#edf2ef);color:#52756b;font-weight:700}
    .hero-photo{position:relative;height:205px;background:#1a2824}
    .hero-photo .photo,.hero-photo .photo-placeholder{height:100%}
    .hero-photo:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,#07130fcf)}
    .hero-caption{position:absolute;z-index:1;left:18px;right:18px;bottom:15px;color:white}
    .hero-caption .plate{color:#e0e9e5}
    .hero-content{padding:16px 18px 18px}
    .hero-balance{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .hero-balance strong{font-size:19px}
    .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:13px}
    .hero-stats strong{font-size:14px}
    .split-card{padding:19px}
    .split-top{display:flex;justify-content:space-between;align-items:center;gap:18px}
    .ring{--progress:0%;width:82px;height:82px;flex:none;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--green) var(--progress),var(--accent-soft) 0);position:relative}
    .ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}
    .ring strong{position:relative;font-size:18px}
    .split-balance{margin:20px 0 16px}
    .split-balance strong{display:block;font-size:28px;letter-spacing:-.04em}
    .split-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:14px;border-top:1px solid var(--line)}
    .split-grid strong{font-size:14px}
    .photo-split{display:grid;grid-template-columns:minmax(135px,.72fr) 1fr;min-height:100%}
    .photo-split .photo,.photo-split .photo-placeholder{height:100%;min-height:290px}
    .photo-info{padding:18px;display:flex;flex-direction:column}
    .photo-info .highlight{margin:18px 0 14px;padding:12px;border-radius:11px;background:var(--accent-soft)}
    .photo-info .highlight strong{display:block;font-size:20px}
    .photo-info .progress{margin:8px 0 13px}
    .photo-info .open{align-self:flex-start;margin-top:auto}
    .milestone-card{padding:19px}
    .milestone-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .milestone-top h2{font-size:18px}
    .milestone-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:19px 0 12px}
    .milestone-values>div{min-width:0;padding:10px;border-radius:10px;background:var(--accent-soft)}
    .milestone-values strong{display:block;font-size:14px}
    .milestone-track{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 7px}
    .milestone-track span{position:relative;border-top:3px solid var(--line);padding-top:8px;color:var(--muted);font-size:10px}
    .milestone-track span:first-child{border-color:var(--green)}
    .milestone-track span:not(:first-child):before{content:"";position:absolute;top:-6px;left:0;width:9px;height:9px;border-radius:50%;background:var(--line)}
    .dark-card{padding:19px;background:#10201e;color:#edf6f1;border-color:#263e38}
    .dark-card .plate,.dark-card .label,.dark-card .small{color:#a7beb4}
    .dark-card .status{background:#254138;color:#bce6d5}
    .dark-card .dark-head{display:grid;grid-template-columns:1fr 88px;gap:15px;align-items:center}
    .dark-card .ring{width:78px;height:78px;background:conic-gradient(#84cfb3 var(--progress),#29443b 0)}
    .dark-card .ring:before{background:#10201e}
    .dark-card .dark-remaining{margin:16px 0;padding:14px;border:1px solid #29443b;border-radius:12px;background:#162b26}
    .dark-card .dark-remaining strong{display:block;font-size:23px}
    .dark-card .split-grid{border-color:#29443b}
    .dark-card .open{background:#b4e0ce;color:#10201e}
    .empty{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
    .photo-hero{position:relative;height:205px;background:#1a2824}
    .photo-hero .photo,.photo-hero .photo-placeholder{height:100%}
    .photo-hero:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,#07130fcf);pointer-events:none}
    .photo-hero-caption{position:absolute;z-index:1;left:18px;right:18px;bottom:15px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:#fff}
    .photo-hero-caption .plate{color:#e0e9e5}
    .info-body{padding:18px}
    .info-primary{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .info-big{display:block;margin:3px 0;font-size:27px;font-weight:800;letter-spacing:-.04em}
    .explanation{margin:4px 0 14px;color:var(--muted);font-size:12px}
    .info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
    .info-box{min-width:0;padding:12px;border-radius:11px;background:var(--accent-soft)}
    .info-box strong{display:block;font-size:14px}
    .budget-progress{margin:13px 0}
    .progress-copy{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px}
    .invoice-note{margin-top:13px;padding:10px 12px;border-radius:9px;background:var(--accent-soft);font-size:12px}
    .invoice-note.due{background:var(--amber-soft);color:var(--amber)}
    .budget-rows{display:grid;gap:10px;margin:13px 0}
    .budget-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
    .budget-row:last-child{border-bottom:0;padding-bottom:0}
    .budget-row>span:first-child{color:var(--muted);font-size:12px}
    .budget-row strong{text-align:right;font-size:13px}
    .payment-status{padding:12px;border-radius:10px;background:var(--accent-soft)}
    .payment-status.due{background:var(--amber-soft)}
    .payment-status strong{display:block;font-size:14px}
    .payment-status small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .paid-left{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
    .paid-left>div{padding:12px;border:1px solid var(--line);border-radius:11px}
    .paid-left .info-big{font-size:18px}
    .estimate-range{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
    .estimate-range .label{margin:0}
    .estimate-range .range{font-size:13px;font-weight:700}
    .simple-summary{background:linear-gradient(180deg,var(--panel),var(--accent-soft))}
    .three-amounts .info-grid{grid-template-columns:1fr 1fr}
    .three-amounts .info-box:first-child{grid-column:1/-1}
    .paid-vs-left .progress{height:11px}
    .paid-vs-left .paid-left>div:first-child{background:var(--accent-soft)}
    .invoice-first .budget-rows{margin-bottom:0}
    .budget-card .budget-total{padding:14px;border-radius:12px;background:var(--accent);color:#fff}
    .budget-card .budget-total .info-primary,.budget-card .budget-total .small{color:#d5e9e1}
    .budget-card .budget-total .info-big{font-size:25px}
    [data-theme="dark"] .budget-card .budget-total{color:#10201c}
    [data-theme="dark"] .budget-card .budget-total .info-primary,[data-theme="dark"] .budget-card .budget-total .small{color:#29433a}
    @media(max-width:760px){.shell{padding:18px}.options{grid-template-columns:1fr}.photo-split{grid-template-columns:120px 1fr}.photo-split .photo,.photo-split .photo-placeholder{min-height:300px}}
    @media(max-width:480px){.shell{padding:14px}.header-actions{width:100%}.header-actions>*{flex:1;text-align:center}.hero-photo,.photo-hero{height:180px}.photo-split{grid-template-columns:1fr}.photo-split .photo,.photo-split .photo-placeholder{height:160px;min-height:0}.milestone-values{gap:5px}.milestone-values>div{padding:8px}.milestone-values strong{font-size:12px}.photo-hero-caption{left:14px;right:14px}.info-body{padding:15px}.info-big{font-size:23px}.budget-row{gap:6px}.range{gap:5px}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="intro"><div class="brand">IMPORT / FOCUS · CARD PREVIEW</div><h1>Five clearer summaries</h1><p>Same photo and car details; five ways to explain paid, estimated, and remaining costs.</p></div>
      <div class="header-actions"><a class="button" href="index.html">← Back to cars</a><button id="themeToggle" type="button">Dark mode</button></div>
    </header>
    <section id="options" class="options" aria-label="Five car card information layouts"></section>
  </main>
  <script src="tracker.js"></script>
  <script src="card-options.js"></script>
</body>
</html>
